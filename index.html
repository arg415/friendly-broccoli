<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Amith Gupta — Attorney. Litigation / Civil Rights.">
  <title>Amith Gupta — Attorney</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: #faf9f6;
      color: #202020;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
    }

    main {
      width: 100%;
      max-width: 760px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 400;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .title {
      margin-top: 24px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .practice {
      margin-top: 18px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1.05rem;
      letter-spacing: 0.04em;
      color: #555;
    }

    .bar {
      margin-top: 14px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.82rem;
      color: #777;
    }

    .divider {
      width: 48px;
      height: 1px;
      background: #bbb;
      margin: 48px auto;
    }

    .cv {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 18px;
    }

    .email {
      display: inline-block;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.9rem;
      color: #202020;
      text-decoration: none;
      border-bottom: 1px solid #999;
      padding-bottom: 3px;
      transition: border-color 0.2s, color 0.2s;
    }

    .email:hover {
      color: #666;
      border-color: #666;
    }

    footer {
      margin-top: 64px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.7rem;
      color: #aaa;
      letter-spacing: 0.05em;
    }

    @media (max-width: 600px) {
      body {
        padding: 32px 20px;
      }

      .divider {
        margin: 38px auto;
      }

      footer {
        margin-top: 50px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Amith Gupta</h1>

    <div class="title">Attorney</div>

    <div class="practice">Litigation / Civil Rights</div>

    <div class="bar">Barred in New York, California, and Georgia</div>

    <div class="divider"></div>

    <div class="cv">
      For a full CV, please contact me directly by email.
    </div>

    <a
      class="email"
      href="mailto:amith@amithgupta.com"
    >
      amith [at] amithgupta [dot] com
    </a>

    <footer>
      © Amith Gupta
    </footer>
  </main>
</body>
</html>
